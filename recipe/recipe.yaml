schema_version: 1

context:
  name: unyts
  version: "1.0.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/unyts-${{ version }}.tar.gz
  sha256: dfc66ad619882b4c6847cc021c7533ccf55b94b35ce1d7c820aaf133139b04c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - stringthings
    - cloudpickle

tests:
  - python:
      imports:
        - unyts
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: an unit converter based on graph network and classes to operate with units.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ayaranitram/unyts

extra:
  recipe-maintainers:
    - jan-janssen
